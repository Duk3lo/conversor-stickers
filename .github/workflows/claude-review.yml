# Revisión automática de PRs con Claude Code.
# Basado en el ejemplo oficial: https://code.claude.com/docs/en/github-actions
# Requiere la GitHub App de Claude instalada en el repo y el secreto
# CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) o ANTHROPIC_API_KEY.
name: Revisión de Claude

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          # Con suscripción de Claude. Con API key, sustituir por:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Necesario: sin esto no se arranca el MCP que publica comentarios en línea.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
